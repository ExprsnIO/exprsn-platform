# Single-origin edge for the Exprsn Platform.
#  - Serves the built SPA (web/dist) as static files with history fallback.
#  - Proxies the API module prefixes + the single Socket.IO path to the Node
#    gateway on the host (HTTPS :8443).
# This keeps the SPA and the JSON APIs on ONE origin (443), so credentialed
# requests stay same-origin (the gateway refuses wildcard CORS with creds) and
# the OIDC issuer / cookies / sockets all share the origin.
#
# host.docker.internal resolves to the Docker host (extra_hosts in compose).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;

  upstream exprsn_gateway {
    server host.docker.internal:8443;
  }

  # Shared proxy settings for the gateway (HTTPS upstream, self-signed in dev).
  proxy_ssl_verify off;
  proxy_http_version 1.1;

  # Plain HTTP -> redirect to HTTPS (mirrors the Node :8080 redirect).
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Reuses the dev self-signed cert from `npm run gen:certs`.
    ssl_certificate     /etc/nginx/certs/platform.crt;
    ssl_certificate_key /etc/nginx/certs/platform.key;

    client_max_body_size 100m;

    # --- Security response headers (BUG-038) --------------------------------
    # The browser's security context comes from THIS document origin (:443),
    # not the JSON gateway on :8443 — so the edge must set them. Declared at
    # server level with `always` so every location (static SPA, proxied API,
    # docs) inherits them; none of the locations below declare their own
    # add_header (which would drop the inherited set).
    #
    # CSP notes (everything the SPA loads is same-origin through this edge):
    #  - script-src 'self'        — fonts self-hosted (@fontsource) and the
    #                               theme bootstrap moved to /theme-init.js,
    #                               so no 'unsafe-inline' and no external
    #                               origins are needed.
    #  - style-src 'unsafe-inline'— required by MUI/Emotion runtime style
    #                               injection; nginx serves static files so
    #                               per-request nonces aren't practical.
    #  - img/media blob: data:    — E2EE spark attachments, filevault previews
    #                               and the image annotator decrypt/compose to
    #                               object/data URLs; HLS (/srs/) and uploads
    #                               are same-origin ('self').
    #  - frame-src 'self' blob:   — filevault PDF preview iframes a blob URL.
    #  - worker-src 'self' blob:  — Monaco editor workers (Vite ?worker).
    #  - connect-src 'self' blob: — all API + Socket.IO traffic is same-origin
    #                               via this proxy ('self' also matches wss://
    #                               same-host per CSP3); blob: for client-side
    #                               file readers on object URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # /live WebRTC (publish + rooms + screen share) needs camera/mic/display
    # capture for this origin only; everything else stays denied.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Static SPA bundle (web/dist mounted read-only).
    root /usr/share/nginx/html;
    index index.html;

    # --- Backend API module prefixes -> gateway ------------------------------
    # Regex locations take precedence over the `location /` SPA fallback.
    # Requires a `/` after the prefix: every real API path is `/<mod>/api/...`
    # or deeper, while a BARE `/lowcode`, `/vault`, ... is a browser deep-link
    # that must fall through to the SPA (which 404s it client-side) instead of
    # returning the gateway's JSON NOT_FOUND.
    location ~ ^/(ca|auth|spark|nexus|filevault|vault|timeline|prefetch|moderator|live|atproto|lowcode|plugins|cortex)/ {
      proxy_pass https://exprsn_gateway;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # Aggregate health endpoint (exact match; no SPA route shares it).
    location = /health {
      proxy_pass https://exprsn_gateway;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # --- AT-Protocol XRPC (incl. subscribeLabels WebSocket) + did:web -------
    location ~ ^/(xrpc|\.well-known)(/|$) {
      proxy_pass https://exprsn_gateway;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_read_timeout 300s;
    }

    # --- Single Socket.IO server (WebSocket upgrade) -> gateway --------------
    location /socket.io/ {
      proxy_pass https://exprsn_gateway;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
    }

    # --- Self-hosted SRS HLS/FLV playback (same-origin HTTPS) ---------------
    # The browser plays /srs/live/<key>.m3u8; this proxies to the SRS HTTP
    # server on the host (published on SRS_HTTP_PORT, default 8085), so HLS is
    # served same-origin over HTTPS instead of mixed-content http://:8085.
    location /srs/ {
      proxy_pass http://host.docker.internal:8085/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # HLS segments are short-lived; don't let proxies over-cache the playlist.
      proxy_buffering off;
    }

    # --- Docs site (static, bind-mounted at /srv — see docker-compose nginx
    # volumes). The viewer fetches ../<FILE>.md, so repo-root Markdown files
    # are exposed at /<FILE>.md from /srv/mdroot.
    # NOTE: any `add_header` here drops the inherited server-level set, so the
    # full header set is redeclared with a docs-specific CSP — the generated
    # doc pages use inline <script>/<style> blocks (self-contained viewer), so
    # script-src needs 'unsafe-inline' for /docs/ only. The SPA CSP above stays
    # strict.
    location /docs/ {
      alias /srv/docs/;
      index index.html;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Permissions-Policy "camera=(), microphone=(), display-capture=(), geolocation=(), payment=(), usb=()" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
    location ~ ^/[A-Za-z0-9_.-]+\.md$ {
      root /srv/mdroot;
      default_type text/markdown;
    }

    # --- SPA: serve static assets, fall back to index.html for client routes -
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0066ff" />
    <title>Exprsn</title>
    <!-- Exprsn Unified type families (Inter UI + JetBrains Mono code) are
         self-hosted via @fontsource imports in src/main.tsx — no external
         font origins, so the CSP can stay `font-src 'self'` (BUG-038). -->
    <!-- Set the theme before paint so the design-system tokens are correct on
         first frame (no flash). Blocking classic script served from public/
         so the CSP needs no 'unsafe-inline' for scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

// Minimal BIND9 config for the Exprsn dev stack.
// Recursive resolver for the container network + authoritative for the
// internal `exprsn.local` zone used for service discovery.

options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    forwarders { 1.1.1.1; 8.8.8.8; };
    dnssec-validation auto;
    listen-on { any; };
    listen-on-v6 { any; };
};

zone "exprsn.local" {
    type master;
    file "/etc/bind/db.exprsn.local";
};

# SRS (Simple Realtime Server) config for the Exprsn self-hosted live provider.
# RTMP ingest on 1935, HTTP API on 1985, HTTP server (HLS/FLV) on 8080.
# Publishers push to rtmp://<host>:1935/live/<streamKey>; viewers play
# http://<host>:<SRS_HTTP_PORT>/live/<streamKey>.m3u8 (HLS) — see services/live
# config (platforms.srs) and services/live/src/services/platforms/srs.js.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Low-latency HLS for the browser player (hls.js).
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_cleanup     on;
        hls_dispose     30;
    }
    # HTTP-FLV remux (optional lower-latency playback path).
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    # WebRTC over TCP for sub-second playback (optional).
    rtc {
        enabled     on;
        rtmp_to_rtc on;
    }
}
